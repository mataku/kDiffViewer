name: screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.ref != 'refs/heads/develop'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/generate-screenshot-diff.sh branches the sample from a local develop.
      - run: git fetch --no-tags --depth=1 origin develop:develop
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: ./gradlew :app:createDistributable
      - run: |
          brew install --cask font-cica
          brew install oxipng
      - run: bash scripts/ci/screenshot.sh "$RUNNER_TEMP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: warn
