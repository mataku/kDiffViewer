name: screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.ref != 'refs/heads/develop'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set paths
        run: |
          echo "SAMPLE=$RUNNER_TEMP/cats" >> "$GITHUB_ENV"
          echo "SHOTS=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shots"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: ./gradlew :app:createDistributable

      - name: Write the UI helper
        run: |
          cat > "$RUNNER_TEMP/ui.swift" <<'SWIFT'
          import CoreGraphics
          import CoreText
          import Foundation

          let args = CommandLine.arguments.dropFirst()
          switch args.first ?? "" {
          case "window":
            let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
            for window in windows {
              guard (window[kCGWindowOwnerName as String] as? String) == "kDiffViewer",
                    (window[kCGWindowLayer as String] as? Int) == 0,
                    let number = window[kCGWindowNumber as String] as? Int,
                    let bounds = window[kCGWindowBounds as String] as? [String: Any] else { continue }
              let value = { (key: String) in Int((bounds[key] as? Double) ?? 0) }
              print(number, value("X"), value("Y"), value("Width"), value("Height"))
              exit(0)
            }
            exit(1)
          case "font":
            let families = CTFontManagerCopyAvailableFontFamilyNames() as? [String] ?? []
            let name = args.dropFirst().first ?? ""
            print(families.contains(name))
          case "register":
            let urls = args.dropFirst().map { URL(fileURLWithPath: $0) } as NSArray as CFArray
            CTFontManagerRegisterFontURLs(urls, .user, true) { errors, done in
              (errors as NSArray).forEach { print("register error:", $0) }
              if done { exit(0) }
              return true
            }
            RunLoop.main.run(until: Date().addingTimeInterval(30))
            exit(1)
          case "displays":
            var count: UInt32 = 0
            CGGetActiveDisplayList(0, nil, &count)
            var ids = [CGDirectDisplayID](repeating: 0, count: Int(count))
            CGGetActiveDisplayList(count, &ids, &count)
            for id in ids {
              let b = CGDisplayBounds(id)
              let m = CGDisplayCopyDisplayMode(id)
              print(id, id == CGMainDisplayID() ? "main" : "-", b.origin.x, b.origin.y, m?.width ?? 0, m?.height ?? 0, m?.pixelWidth ?? 0, m?.pixelHeight ?? 0)
            }
          case "move":
            let values = args.dropFirst().compactMap { Double($0) }
            guard values.count == 2 else { exit(2) }
            CGEvent(mouseEventSource: nil, mouseType: .mouseMoved, mouseCursorPosition: CGPoint(x: values[0], y: values[1]), mouseButton: .left)?.post(tap: .cghidEventTap)
          case "click":
            let values = args.dropFirst().compactMap { Double($0) }
            guard values.count == 2 else { exit(2) }
            let point = CGPoint(x: values[0], y: values[1])
            for type in [CGEventType.mouseMoved, .leftMouseDown, .leftMouseUp] {
              CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
              usleep(80_000)
            }
          case "key":
            // key <virtual key code> [cmd]
            guard let code = args.dropFirst().first.flatMap({ CGKeyCode($0) }) else { exit(2) }
            let flags: CGEventFlags = args.dropFirst(2).first == "cmd" ? .maskCommand : []
            for down in [true, false] {
              let event = CGEvent(keyboardEventSource: nil, virtualKey: code, keyDown: down)
              event?.flags = flags
              event?.post(tap: .cghidEventTap)
              usleep(80_000)
            }
          default:
            exit(2)
          }
          SWIFT

      - name: Install and register Cica
        run: |
          brew install --cask font-cica
          ui() { swift "$RUNNER_TEMP/ui.swift" "$@"; }
          ui register "$HOME"/Library/Fonts/Cica-*.ttf
          for _ in $(seq 1 15); do
            [ "$(ui font Cica)" = true ] && break
            sleep 2
          done
          echo "Cica available: $(ui font Cica)"
          [ "$(ui font Cica)" = true ]

      - name: Add a HiDPI virtual display
        run: |
          cat > "$RUNNER_TEMP/vdisplay.m" <<'OBJC'
          // CGVirtualDisplay is private API (the one DeskPad and BetterDisplay use); the runner's display has no 2x modes.
          #import <CoreGraphics/CoreGraphics.h>
          #import <Foundation/Foundation.h>

          @interface CGVirtualDisplayDescriptor : NSObject
          @property(retain, nonatomic) dispatch_queue_t queue;
          @property(copy, nonatomic) NSString *name;
          @property(nonatomic) unsigned int maxPixelsWide;
          @property(nonatomic) unsigned int maxPixelsHigh;
          @property(nonatomic) CGSize sizeInMillimeters;
          @property(nonatomic) unsigned int productID;
          @property(nonatomic) unsigned int vendorID;
          @property(nonatomic) unsigned int serialNum;
          @end

          @interface CGVirtualDisplayMode : NSObject
          - (instancetype)initWithWidth:(NSUInteger)width height:(NSUInteger)height refreshRate:(double)refreshRate;
          @end

          @interface CGVirtualDisplaySettings : NSObject
          @property(retain, nonatomic) NSArray *modes;
          @property(nonatomic) unsigned int hiDPI;
          @end

          @interface CGVirtualDisplay : NSObject
          - (instancetype)initWithDescriptor:(CGVirtualDisplayDescriptor *)descriptor;
          - (BOOL)applySettings:(CGVirtualDisplaySettings *)settings;
          @property(readonly, nonatomic) CGDirectDisplayID displayID;
          @end

          int main(void) {
            @autoreleasepool {
              const unsigned int width = 1600, height = 1000;
              CGVirtualDisplayDescriptor *descriptor = [CGVirtualDisplayDescriptor new];
              descriptor.queue = dispatch_get_main_queue();
              descriptor.name = @"Screenshot";
              descriptor.maxPixelsWide = width * 2;
              descriptor.maxPixelsHigh = height * 2;
              descriptor.sizeInMillimeters = CGSizeMake(345, 216);
              descriptor.productID = 0x1234;
              descriptor.vendorID = 0x3456;
              descriptor.serialNum = 1;
              CGVirtualDisplay *display = [[CGVirtualDisplay alloc] initWithDescriptor:descriptor];
              if (display == nil) { fprintf(stderr, "could not create the virtual display\n"); return 1; }
              CGVirtualDisplaySettings *settings = [CGVirtualDisplaySettings new];
              settings.hiDPI = 1;
              settings.modes = @[[[CGVirtualDisplayMode alloc] initWithWidth:width height:height refreshRate:60]];
              if (![display applySettings:settings]) { fprintf(stderr, "could not apply the settings\n"); return 1; }
              CGDirectDisplayID displayID = display.displayID;
              printf("virtual display %u\n", displayID);
              fflush(stdout);
              // The new display is not ready to be moved right after applySettings.
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                CGDirectDisplayID physicalID = CGMainDisplayID();
                CGDisplayConfigRef config;
                CGBeginDisplayConfiguration(&config);
                // Both origins move in one transaction; moving only the new display leaves the old one at the origin as main.
                CGConfigureDisplayOrigin(config, displayID, 0, 0);
                CGConfigureDisplayOrigin(config, physicalID, width, 0);
                CGError error = CGCompleteDisplayConfiguration(config, kCGConfigureForSession);
                CGDisplayModeRef mode = CGDisplayCopyDisplayMode(displayID);
                printf("made main: error %d, main %u, virtual mode %zu x %zu (%zu x %zu px)\n", error, CGMainDisplayID(), CGDisplayModeGetWidth(mode), CGDisplayModeGetHeight(mode), CGDisplayModeGetPixelWidth(mode), CGDisplayModeGetPixelHeight(mode));
                fflush(stdout);
              });
              dispatch_main();
            }
          }
          OBJC
          clang -fobjc-arc -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/vdisplay.m" -o "$RUNNER_TEMP/vdisplay"
          nohup "$RUNNER_TEMP/vdisplay" > "$RUNNER_TEMP/vdisplay.log" 2>&1 &
          sleep 8
          cat "$RUNNER_TEMP/vdisplay.log"
          ui() { swift "$RUNNER_TEMP/ui.swift" "$@"; }
          ui displays
          # Fields: id, main, x, y, width, height, pixel width, pixel height.
          ui displays | awk '$2 == "main" { ok = ($7 == $5 * 2) } END { exit !ok }'

      - name: Write settings
        run: |
          dir="$HOME/Library/Application Support/kDiffViewer"
          mkdir -p "$dir"
          printf '%s\n' '{"appearance":"Dim","fontFamily":"Cica"}' > "$dir/settings.json"
          printf '%s\n' '{"mainWidth":1360,"mainHeight":880,"treeWidth":260}' > "$dir/window-state.json"
          defaults write -g AppleInterfaceStyle -string Dark

      - name: Create the sample repository
        run: |
          git branch --force develop origin/develop
          scripts/generate-screenshot-diff.sh "$SAMPLE"

      - name: Open the sample in the app
        run: |
          app="$PWD/app/build/compose/binaries/main/app/kDiffViewer.app"
          kdv="$app/Contents/app/resources/kdv"
          echo "KDV=$kdv" >> "$GITHUB_ENV"
          KDV_APP="$app" "$kdv" "$SAMPLE" --base develop
          for _ in $(seq 1 60); do
            "$kdv" windows | grep -qv '^No windows' && break
            sleep 2
          done
          "$kdv" windows
          sleep 5

      - name: Capture the diff window
        run: |
          read -r id x y w h < <(swift "$RUNNER_TEMP/ui.swift" window)
          echo "window $id at $x,$y size ${w}x$h"
          screencapture -x -l "$id" "$SHOTS/dim-screen.png"

      - name: Comment through the UI
        run: |
          ui() { swift "$RUNNER_TEMP/ui.swift" "$@"; }
          read -r id x y w h < <(ui window)
          # Offsets inside the 1360x880 window: the add-comment button of new line 115, the review bar's field and Send to Agent.
          ui move $((x + 700)) $((y + 388))
          sleep 0.5
          ui move $((x + 384)) $((y + 388))
          sleep 0.5
          ui click $((x + 384)) $((y + 388))
          sleep 1
          printf '%s' 'Mochi as the default name feels arbitrary. Can we take it from `CatNames.suggest` instead?' | pbcopy
          ui key 9 cmd
          sleep 0.5
          ui key 36 cmd
          sleep 1
          ui click $((x + 300)) $((y + h - 20))
          sleep 0.5
          printf '%s' 'What is this branch for? Give me a short overview before I keep reading.' | pbcopy
          ui key 9 cmd
          sleep 0.5
          ui click $((x + w - 60)) $((y + h - 20))
          sleep 1
          cd "$SAMPLE"
          "$KDV" thread list
          "$KDV" thread reply t2 'This branch adds `CatNames`, which builds a title-and-name pair from a seed and describes a cat by age and favorite spot, plus its tests. It also enlarges the default window and adds a README section. Start with `CatNames.kt`; the `Main.kt` change is only the window size and a greeting.'
          "$KDV" thread reply t1 'Good point. I will call `CatNames.suggest(0)` there instead of hard-coding Mochi.'
          sleep 2
          screencapture -x -l "$id" "$SHOTS/agent-review.png"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: warn
